[package]
name = "red-lsp"
version = "0.1.1"
edition = "2024"

[dependencies]
tree-sitter = "0.26.6"
tree-sitter-red = { git = "https://github.com/qtxie/tree-sitter-red.git", rev = "4eae5809f1c0d7fc78dadeb4227ebdfcd41c9ded" }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
anyhow = "1.0"
crossbeam-channel = "0.5"
ropey = "1.6"
log = "0.4"
env_logger = "0.11"
compact_str = "0.9.0"
fast_radix_trie = "1.1.0"
url = "2.5.8"
hashbrown = "0.16"
rust-embed = { version = "8", features = ["include-exclude"] }

[profile.release]
strip = "symbols"
lto = true
